<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<title>AegisAI - First-Run Setup</title>
<link rel="stylesheet" href="/vendor/github-dark.min.css" />
<style>
  :root { --bg:#0f1115; --panel:#181b22; --panel2:#1f232d; --border:#2a2f3a; --text:#e6e9ef; --muted:#9aa3b2; --accent:#6ea8fe; --accent2:#7ee787; --danger:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .wizard { background:var(--panel); border:1px solid var(--border); border-radius:16px; max-width:640px; width:100%; padding:28px; box-shadow:0 8px 32px rgba(0,0,0,.4); }
  .wizard h1 { margin:0 0 4px; font-size:22px; }
  .wizard .subtitle { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .steps { display:flex; gap:6px; margin-bottom:24px; }
  .step { flex:1; height:6px; border-radius:3px; background:var(--panel2); transition:background .3s; }
  .step.done { background:var(--accent2); }
  .step.active { background:var(--accent); }
  .step-content { min-height:220px; }
  .step-content h2 { margin:0 0 12px; font-size:17px; }
  .step-content p { color:var(--muted); font-size:13px; line-height:1.6; }
  .check { display:flex; align-items:center; gap:10px; padding:10px; background:var(--panel2); border-radius:8px; margin:8px 0; }
  .check .icon { font-size:18px; }
  .check.ok .icon { color:var(--accent2); }
  .check.fail .icon { color:var(--danger); }
  .check .label { flex:1; font-size:13px; }
  .model-list { max-height:260px; overflow:auto; border:1px solid var(--border); border-radius:8px; padding:8px; }
  .model-item { display:flex; align-items:center; gap:8px; padding:6px; border-bottom:1px solid var(--border); font-size:13px; }
  .model-item:last-child { border-bottom:none; }
  .model-item .size { color:var(--muted); font-size:11px; margin-left:auto; }
  .btn-row { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
  button { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); cursor:pointer; font-size:13px; }
  button.primary { background:var(--accent); color:#0b1220; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status { font-size:12px; margin-top:8px; min-height:16px; }
  .status.err { color:var(--danger); }
  .status.ok { color:var(--accent2); }
  .progress { height:6px; background:var(--panel2); border-radius:3px; overflow:hidden; margin:8px 0; }
  .progress-bar { height:100%; background:var(--accent); transition:width .3s; width:0%; }
  code { background:var(--panel2); padding:2px 6px; border-radius:4px; font-size:12px; }
  input[type=text] { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px; width:100%; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wizard">
  <h1>Welcome to AegisAI</h1>
  <div class="subtitle">First-run setup wizard. This will only take a moment.</div>
  <div class="steps" id="steps">
    <div class="step" data-step="0"></div>
    <div class="step" data-step="1"></div>
    <div class="step" data-step="2"></div>
    <div class="step" data-step="3"></div>
    <div class="step" data-step="4"></div>
  </div>
  <div class="step-content" id="stepContent"></div>
  <div class="btn-row" id="btnRow"></div>
</div>
<script src="/setup.js"></script>
</body>
</html>
