name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Syntax check server.js
        run: node --check server.js
      - name: Syntax check public JS
        run: |
          node -e "const fs=require('fs'); const h=fs.readFileSync('public/index.html','utf8'); const s=h.indexOf('<script>'); const e=h.lastIndexOf('</script>'); fs.writeFileSync(process.env.RUNNER_TEMP + '/check.js', h.slice(s+8,e));"
          node --check "$RUNNER_TEMP/check.js"
      - name: Unit and integration tests
        run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Check for large files
        run: |
          find . -name '*.js' -size +500k -not -path './node_modules/*' -exec echo "Large file: {}" \;
