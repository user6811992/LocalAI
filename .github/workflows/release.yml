name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        run: .\installer\build.ps1 -BundleNode
      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/AegisAI-Setup-*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build .dmg
        run: bash installer/build-dmg.sh
      - name: Upload .dmg
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/AegisAI-*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Build AppImage
        run: bash installer/build-appimage.sh
      - name: Upload AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/AegisAI-*.AppImage
      - name: Build source zip
        run: |
          rm -rf /tmp/AegisAI-zip && mkdir -p /tmp/AegisAI-zip/AegisAI
          rsync -a --exclude='node_modules' --exclude='.git' --exclude='*.log' --exclude='repos' --exclude='tools' --exclude='workspace' --exclude='.update-backup' --exclude='data' --exclude='installer/output' --exclude='installer/AegisAI.AppDir' --exclude='installer/AegisAI.app' . /tmp/AegisAI-zip/AegisAI/
          cd /tmp/AegisAI-zip && zip -r "$GITHUB_WORKSPACE/installer/output/AegisAI-${{ github.ref_name }}.zip" AegisAI
      - name: Upload source zip
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/AegisAI-*.zip