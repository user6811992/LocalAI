services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3

  aegisai:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - PORT=8080
      - LOCALAI_TOKEN=${LOCALAI_TOKEN:-}
    volumes:
      - aegisai_data:/app/data
      - ./memory.json:/app/memory.json
      - ./chats.json:/app/chats.json
      - ./skills.json:/app/skills.json
      - ./search-config.json:/app/search-config.json
      - ./workspace:/app/workspace
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
  aegisai_data:
