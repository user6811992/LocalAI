services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  aegisai:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - BACKEND_TYPE=${BACKEND_TYPE:-ollama}
      - BACKEND_URL=${BACKEND_URL:-http://ollama:11434}
      - PORT=8080
      - HOST=0.0.0.0
      # Set LOCALAI_TOKEN in your .env (or shell) before exposing port 8080
      # beyond localhost; an empty value disables auth (only safe for local use).
      - LOCALAI_TOKEN=${LOCALAI_TOKEN:-}
      - AEGISAI_DATA_DIR=/app/data
    volumes:
      - aegisai_data:/app/data
      - aegisai_workspace:/app/workspace
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/index.html').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
  aegisai_data:
  aegisai_workspace:
